[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zer0code"
version = "0.11.0"
description = "Autonomous AI Coding Agent for Expert Penetration Testers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "aloc999"},
]
keywords = ["ai", "agent", "pentesting", "security", "coding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]
crypto = [
    "cryptography>=42.0",
]
tui = [
    "textual>=0.70.0",
]

[project.scripts]
zer0code = "zer0code.cli:main"
z0 = "zer0code.cli:main"

[project.urls]
Homepage = "https://github.com/aloc999/zer0code"
Repository = "https://github.com/aloc999/zer0code"
Issues = "https://github.com/aloc999/zer0code/issues"

[tool.setuptools.packages.find]
include = ["zer0code*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
