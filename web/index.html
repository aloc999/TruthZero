<!doctype html>
<html><head><meta charset="utf-8"><title>ZER0CODE // NEON GRID</title>
<style>
:root{--pink:#ff2a6d;--cyan:#00f0ff;--green:#05ffa1;--yel:#ffd319;--pur:#7b2ff7;--bg:#05010f}
*{box-sizing:border-box}body{background:var(--bg);color:#c9d1d9;font-family:monospace;margin:0;padding:20px 24px 60px;
background-image:linear-gradient(rgba(123,47,247,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(123,47,247,.07) 1px,transparent 1px);background-size:44px 44px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
h1{color:var(--cyan);text-shadow:0 0 12px var(--cyan);letter-spacing:4px;margin:4px 0}
.sub{color:var(--green);letter-spacing:2px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}
.card{border:1px solid #ff2a6d66;border-radius:10px;padding:14px 16px;background:rgba(13,2,33,.82);box-shadow:0 0 18px rgba(255,42,109,.12)}
.card h2{margin:0 0 10px;font-size:14px;letter-spacing:3px;color:var(--yel);text-shadow:0 0 8px var(--yel)}
.full{grid-column:1/-1}
input,select,button{font-family:monospace;background:#0d0221;color:var(--green);border:1px solid var(--pur);border-radius:6px;padding:8px 10px}
button{cursor:pointer;color:#05010f;background:var(--green);font-weight:bold;border:none;box-shadow:0 0 10px var(--green)}
button:hover{filter:brightness(1.2)}
.live{color:var(--pink);text-shadow:0 0 8px var(--pink);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.flow{stroke-dasharray:8 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.chip{display:inline-block;border:1px solid;border-radius:4px;padding:0 6px;font-size:11px;margin-right:6px}
.find{border-left:3px solid var(--pur);padding:6px 10px;margin:8px 0;background:rgba(0,240,255,.04)}
.find .t{color:#fff}.find .m{color:#8b949e;font-size:11px}
.wbar{height:5px;background:#21262d;border-radius:3px;margin-top:4px}.wbar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 6px var(--pink)}
.sev-critical{color:#f85149}.sev-high{color:var(--pink)}.sev-medium{color:var(--yel)}.sev-low{color:var(--cyan)}.sev-info{color:#8b949e}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar .lbl{width:70px}.bar .tr{flex:1;background:#21262d;border-radius:3px;height:12px}.bar .fl{height:100%;border-radius:3px}
#st{margin-left:10px;color:var(--yel)}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<h1>⚡ ZER0CODE <span class="live">// LIVE</span></h1>
<div class="sub">NEON GRID · swarm topology · findings stream · scan console</div>

<div class="grid">
<div class="card full"><h2>◢ SCAN CONSOLE</h2>
<input id="t" placeholder="target (must be in scope)" size="28">
<input id="s" placeholder="scope (default = target)" size="28">
<input id="r" placeholder="rounds" size="6" value="6">
<select id="m"><option value="swarm">swarm</option><option value="sequential">sequential</option></select>
<button onclick="scan()">HUNT</button><span id="st"></span>
<span style="float:right"><a style="color:var(--cyan)" id="sarif" href="#" target="_blank">SARIF</a></span>
</div>

<div class="card"><h2>◢ SWARM TOPOLOGY</h2><svg id="topo" viewBox="0 0 620 330" width="100%"></svg></div>
<div class="card"><h2>◢ SEVERITY</h2><div id="sev"></div><h2 style="margin-top:14px">◢ BOARD</h2><div id="meta" style="font-size:12px"></div></div>
<div class="card full"><h2>◢ FINDINGS STREAM</h2><div id="stream"></div></div>
</div>

<script>let bf='';
const SEVC={critical:'#f85149',high:'#ff2a6d',medium:'#ffd319',low:'#00f0ff',info:'#8b949e'};
const NS='http://www.w3.org/2000/svg';
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function node(g,x,y,label,hot,color,sub){el('circle',{cx:x,cy:y,r:hot>0?30:24,fill:'#0d0221',stroke:color,'stroke-width':hot>0?3:1.5,style:hot>0?`filter:drop-shadow(0 0 8px ${color})`:''},g);
const t=el('text',{x:x,y:y+5,'text-anchor':'middle',fill:color,'font-size':9,'font-family':'monospace'},g);t.textContent=label;
if(sub!==undefined){const s=el('text',{x:x,y:y+40,'text-anchor':'middle',fill:'#8b949e','font-size':10,'font-family':'monospace'},g);s.textContent=sub}}
function edge(g,x1,y1,x2,y2,w,color){el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:color,'stroke-width':w,'stroke-opacity':.25+.5*Math.min(w/6,1),class:'flow'},g)}
function renderTopo(sum,findings){
const g=document.getElementById('topo');g.innerHTML='';
const hot=f=>f.filter(x=>(x.current_weight||0)>=0.2);
const byT=t=>hot(findings).filter(x=>x.ftype===t).length;
const nSub=byT('SUBDOMAIN')+byT('ENDPOINT'),nV=byT('VULN'),nC=byT('VULN_CONFIRMED'),nR=byT('OBJECT_REF');
const cx=310,cy=165;
node(g,cx,cy,'BOARD',nC,'#00f0ff',`${sum.total} findings`);
node(g,90,165,'RECON',nSub,'#05ffa1',`${nSub} hot`);edge(g,116,165,284,165,1+nSub,'#05ffa1');
node(g,310,45,'CLASSIFY',nV,'#ffd319',`${nV} hot`);edge(g,310,71,310,139,1+nV,'#ffd319');
node(g,530,165,'EXPLOIT',nC,'#ff2a6d',`${nC} hot`);edge(g,336,165,504,165,1+nC,'#ff2a6d');
node(g,310,285,'REPORT',nC,'#7b2ff7',nC?'ready':'idle');edge(g,310,191,310,259,1+(nC?2:0),'#7b2ff7');
const extra=[...new Set(findings.map(f=>f.agent).filter(a=>a&&!['recon','classify','exploit','report','bench'].includes(a)))].slice(0,3);
extra.forEach((a,i)=>{const x=120+i*80,y=300;node(g,x,y,a.slice(0,10).toUpperCase(),1,'#ff2a6d','on-demand');edge(g,x,y-20,cx-120+i*40,cy+26,1.5,'#ff2a6d')});
if(!sum.total){const t=el('text',{x:cx,y:228,'text-anchor':'middle',fill:'#8b949e','font-size':11,'font-family':'monospace'},g);t.textContent='board empty — run a HUNT above'}}
function renderSev(sum){const d=document.getElementById('sev');const bs=sum.by_severity||{};const order=['critical','high','medium','low','info'];
const mx=Math.max(1,...order.map(k=>bs[k]||0));
d.innerHTML=order.map(k=>`<div class="bar"><span class="lbl sev-${k}">${k}</span><span class="tr"><span class="fl" style="display:block;width:${100*(bs[k]||0)/mx}%;background:${SEVC[k]};box-shadow:0 0 8px ${SEVC[k]}"></span></span><span>${bs[k]||0}</span></div>`).join('')}
function renderStream(findings){const d=document.getElementById('stream');
if(!findings.length){d.innerHTML='<span style="color:#8b949e">no findings yet</span>';return}
d.innerHTML=findings.slice(0,25).map(f=>`<div class="find" style="border-color:${SEVC[f.severity]||'#8b949e'}">
<span class="chip" style="color:${SEVC[f.severity]};border-color:${SEVC[f.severity]}">${f.ftype}</span>
<span class="chip sev-${f.severity}">${f.severity}</span><span class="t">${f.title}</span>
<div class="m">w=${(f.current_weight||0).toFixed(2)} · ${f.target||'-'} · by ${f.agent||'?'}</div>
<div class="wbar"><i style="width:${100*(f.current_weight||0)}%"></i></div></div>`).join('')}
async function poll(){if(!bf)return;try{const r=await fetch('/api/findings?board_file='+encodeURIComponent(bf));const j=await r.json();
renderTopo(j.summary,j.findings);renderSev(j.summary);document.getElementById('meta').textContent=JSON.stringify(j.summary.by_type);
renderStream(j.findings)}catch(e){}}
async function scan(){const t=document.getElementById('t').value;if(!t)return;
document.getElementById('st').textContent='hunting…';
const r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({target:t,scope:document.getElementById('s').value||t,rounds:+document.getElementById('r').value||6,mode:document.getElementById('m').value})});
const j=await r.json();
if(!r.ok){document.getElementById('st').textContent='ERR: '+(j.error||r.status);return}
bf=j.board_file;document.getElementById('sarif').href='/api/sarif?board_file='+encodeURIComponent(bf);
document.getElementById('st').textContent=`${j.confirmed} confirmed / ${j.findings_total} findings in ${j.duration_s}s`;poll()}
renderTopo({total:0},[]);setInterval(poll,3000)</script>
</body></html>
